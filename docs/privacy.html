<h1>隐私政策</h1>
<p>更新日期：2026-11-05</p>
<p>yt-uploader 是个人自用工具，通过 Google OAuth 获取授权，仅用于将视频上传到授权账号自己的 YouTube 频道。</p>
<ul>
<li>我们不会将访问令牌或视频内容出售、共享给任何第三方。</li>
<li>OAuth 令牌仅保存在运行上传脚本的私有环境中，用于调用 YouTube Data API。</li>
<li>不收集、不分析观看者或其他用户的个人数据。</li>
<li>你可以随时在 Google 账号的「第三方应用访问权限」中撤销授权。</li>
</ul>
<p>联系：通过该 Google 账号对应的邮箱即可。</p>
